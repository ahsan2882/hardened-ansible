---
driver:
  name: podman

platforms:
  - name: nginx-ubuntu
    image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

ansible:
  env:
    ANSIBLE_CONFIG: /home/ansible/projects/hardened-ansible/ansible.cfg
    ANSIBLE_COLLECTIONS_PATH: /home/ansible/projects/hardened-ansible/collections

provisioner:
  name: ansible
  inventory:
    host_vars:
      nginx-ubuntu:
        ansible_user: root

verifier:
  name: ansible
