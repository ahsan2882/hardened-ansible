---
- name: Verify Nginx configuration
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Check Nginx package
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert Nginx is installed
      ansible.builtin.assert:
        that:
          - "'nginx' in ansible_facts.packages"

    - name: Check Nginx service
      ansible.builtin.command:
        cmd: systemctl is-active nginx
      register: nginx_service
      changed_when: false
      failed_when: nginx_service.stdout != "active"

    - name: Validate Nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Check Nginx security configuration
      ansible.builtin.command:
        cmd: nginx -T
      register: nginx_full_config
      changed_when: false

    - name: Assert Nginx security settings
      ansible.builtin.assert:
        that:
          - "'server_tokens off;' in nginx_full_config.stdout"
          - "'zone=ansible_per_ip:10m' in nginx_full_config.stdout"
          - "'rate=10r/s;' in nginx_full_config.stdout"
          - "'limit_req zone=ansible_per_ip burst=20 nodelay;' in nginx_full_config.stdout"
          - "'X-Content-Type-Options' in nginx_full_config.stdout"
          - "'X-Frame-Options' in nginx_full_config.stdout"
          - "'Referrer-Policy' in nginx_full_config.stdout"
          - "'Permissions-Policy' in nginx_full_config.stdout"
        fail_msg: "One or more Nginx security settings are missing."
        success_msg: "Nginx security settings are configured."

    - name: Check HTTP response headers
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: nginx-ubuntu
        return_content: false
        status_code: 200
      register: nginx_http_response

    - name: Assert HTTP security headers
      ansible.builtin.assert:
        that:
          - nginx_http_response.x_content_type_options == 'nosniff'
          - nginx_http_response.x_frame_options == 'SAMEORIGIN'
          - nginx_http_response.referrer_policy == 'strict-origin-when-cross-origin'
          - >-
            nginx_http_response.permissions_policy ==
            'camera=(), microphone=(), geolocation=()'
          - "'server' in nginx_http_response"
        fail_msg: "Expected HTTP security headers are missing."

    - name: Check deployed website content
      ansible.builtin.command:
        cmd: grep -q 'Hardened Ansible' /var/www/hardened-ansible/index.html
      changed_when: false

    - name: Check HTTP virtual host configuration
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/nginx-ubuntu
      register: nginx_site

    - name: Assert virtual host is enabled
      ansible.builtin.assert:
        that:
          - nginx_site.stat.exists
