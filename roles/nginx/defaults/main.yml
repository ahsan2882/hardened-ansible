---
nginx_service_enabled: true
nginx_service_state: started

nginx_server_name: "{{ inventory_hostname }}.hardened-ansible.test"
nginx_listen_port: 80

nginx_document_root: /var/www/hardened-ansible
nginx_index_title: "Hardened Ansible Web Server"

nginx_remove_default_site: true
nginx_tls_enabled: false
