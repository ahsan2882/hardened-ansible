---
- name: Verify Fail2ban configuration
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Check Fail2ban package
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert Fail2ban is installed
      ansible.builtin.assert:
        that:
          - "'fail2ban' in ansible_facts.packages"

    - name: Check Fail2ban service
      ansible.builtin.command:
        cmd: systemctl is-active fail2ban
      register: fail2ban_service
      changed_when: false
      failed_when: fail2ban_service.stdout != "active"

    - name: Retrieve SSH jail configuration
      ansible.builtin.command:
        cmd: fail2ban-client get sshd bantime
      register: fail2ban_bantime
      changed_when: false

    - name: Assert SSH jail bantime
      ansible.builtin.assert:
        that:
          - "'600' in fail2ban_bantime.stdout"

    - name: Retrieve SSH jail actions
      ansible.builtin.command:
        cmd: fail2ban-client get sshd actions
      register: fail2ban_actions
      changed_when: false

    - name: Assert UFW is configured as the ban action
      ansible.builtin.assert:
        that:
          - "'ufw' in fail2ban_actions.stdout"
        fail_msg: "Fail2ban is not using the UFW action."

    - name: Check Fail2ban SSH jail status
      ansible.builtin.command:
        cmd: fail2ban-client status sshd
      register: fail2ban_ssh_status
      changed_when: false

    - name: Assert SSH jail is active
      ansible.builtin.assert:
        that:
          - "'Status for the jail: sshd' in fail2ban_ssh_status.stdout"
          - >-
            fail2ban_ssh_status.stdout
            is search('Currently banned:\\s+\\d+')
        fail_msg: "The SSH jail is not reporting its ban status."
        success_msg: "The SSH jail is active and reporting its ban status."
