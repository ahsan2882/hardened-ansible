---
- name: Install Fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy Fail2ban jail configuration
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.d/ansible.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart Fail2ban

- name: Ensure Fail2ban service is enabled and running
  ansible.builtin.service:
    name: fail2ban
    state: "{{ fail2ban_service_state }}"
    enabled: "{{ fail2ban_service_enabled }}"
