---
driver:
  name: podman

platforms:
  - name: users-ubuntu
    image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

ansible:
  env:
    ANSIBLE_CONFIG: ${ANSIBLE_CONFIG:-../../ansible.cfg}
    ANSIBLE_COLLECTIONS_PATH: ${ANSIBLE_COLLECTIONS_PATH:-../../collections}

provisioner:
  name: ansible
  inventory:
    host_vars:
      users-ubuntu:
        ansible_user: root

verifier:
  name: ansible
