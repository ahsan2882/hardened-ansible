---
- name: Validate Ansible SSH public keys
  ansible.builtin.assert:
    that:
      - users_ansible_authorized_keys | default([]) | length > 0
    fail_msg: >-
      No SSH public keys configured for the Ansible account.
      Set users_ansible_authorized_keys before deploying SSH hardening.
    quiet: true

- name: Ensure managed user accounts exist
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups | join(',') }}"
    append: true
    shell: "{{ item.shell }}"
    create_home: "{{ item.create_home }}"
    state: present
  loop: "{{ users_managed_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Configure authorized SSH public keys
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
    state: present
    manage_dir: true
  loop: "{{ users_managed_accounts | subelements('authorized_keys', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}"

- name: Configure managed sudo policy
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ item.name }}"
    content: "{{ item.name }} ALL=(ALL:ALL) {{ 'NOPASSWD:' if users_sudo_nopasswd else '' }}ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  when: item.manage_sudo | default(false)
  loop: "{{ users_managed_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove cloud-init sudo policy
  ansible.builtin.file:
    path: /etc/sudoers.d/90-cloud-init-users
    state: absent
