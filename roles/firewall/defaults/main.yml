---
firewall_default_incoming_policy: deny
firewall_default_outgoing_policy: allow
firewall_default_routed_policy: deny

firewall_allowed_ports:
  - port: "22"
    protocol: tcp
    comment: SSH
  - port: "80"
    protocol: tcp
    comment: HTTP
  - port: "443"
    protocol: tcp
    comment: HTTPS

firewall_logging: "low"
firewall_enabled: true
