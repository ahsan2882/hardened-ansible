---
- name: Verify local CA
  hosts: all
  become: true
  gather_facts: false

  vars:
    test_ca_directory: /tmp/molecule-local-ca
    system_tls_certificate_validity_days: 397

  tasks:
    - name: Check CA private key
      ansible.builtin.stat:
        path: "{{ test_ca_directory }}/ca.key"
      register: ca_private_key

    - name: Check CA certificate
      ansible.builtin.stat:
        path: "{{ test_ca_directory }}/ca.crt"
      register: ca_certificate

    - name: Check signed server certificate
      ansible.builtin.stat:
        path: "{{ test_ca_directory }}/signed/test-web01.crt"
      register: server_certificate

    - name: Assert CA artifacts exist with correct permissions
      ansible.builtin.assert:
        that:
          - ca_private_key.stat.exists
          - ca_private_key.stat.mode == "0600"
          - ca_certificate.stat.exists
          - server_certificate.stat.exists

    - name: Inspect CA certificate extensions
      ansible.builtin.command:
        cmd: openssl x509 -in {{ test_ca_directory }}/ca.crt -noout -text
      register: ca_certificate_details
      changed_when: false

    - name: Assert CA certificate constraints
      ansible.builtin.assert:
        that:
          - "'CA:TRUE' in ca_certificate_details.stdout"
          - "'Certificate Sign' in ca_certificate_details.stdout"
          - "'CRL Sign' in ca_certificate_details.stdout"

    - name: Verify server certificate against local CA
      ansible.builtin.command:
        cmd: >-
          openssl verify
          -CAfile {{ test_ca_directory }}/ca.crt
          {{ test_ca_directory }}/signed/test-web01.crt
      register: certificate_verification
      changed_when: false

    - name: Assert server certificate is trusted
      ansible.builtin.assert:
        that:
          - "'OK' in certificate_verification.stdout"

    - name: Inspect signed server certificate basic constraints
      ansible.builtin.command:
        cmd: >-
          openssl x509
          -in {{ test_ca_directory }}/signed/test-web01.crt
          -noout -ext basicConstraints
      register: server_basic_constraints
      changed_when: false

    - name: Assert signed server certificate is not a CA
      ansible.builtin.assert:
        that:
          - "'CA:FALSE' in server_basic_constraints.stdout"

    - name: Inspect signed server certificate extended key usage
      ansible.builtin.command:
        cmd: >-
          openssl x509
          -in {{ test_ca_directory }}/signed/test-web01.crt
          -noout -ext extendedKeyUsage
      register: server_extended_key_usage
      changed_when: false

    - name: Assert signed certificate supports server authentication
      ansible.builtin.assert:
        that:
          - "'TLS Web Server Authentication' in server_extended_key_usage.stdout"

    - name: Check signed server certificate validity period
      ansible.builtin.command:
        cmd: >-
          openssl x509
          -in {{ test_ca_directory }}/signed/test-web01.crt
          -checkend {{ ((system_tls_certificate_validity_days | int) - 1) * 86400 }}
          -noout
      register: server_validity_check
      changed_when: false

    - name: Assert signed certificate has the expected validity period
      ansible.builtin.assert:
        that:
          - server_validity_check.rc == 0
