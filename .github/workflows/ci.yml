name: Ansible CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-check:
    name: Playbook syntax checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.21.5

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml -p ./collections

      - name: Check playbook syntax
        run: |
          for playbook in \
            playbooks/site.yml \
            playbooks/generate-csrs.yml \
            playbooks/local-ca.yml \
            playbooks/sign-csrs.yml \
            playbooks/deploy-tls.yml \
            tests/validation/security.yml
          do
            echo "Checking $playbook"
            ansible-playbook --syntax-check \
              -i inventory/hosts.example.yml "$playbook"
          done

  molecule:
    name: Molecule - ${{ matrix.role }}
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.cfg
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections

    strategy:
      fail-fast: false
      matrix:
        role:
          - common
          - fail2ban
          - firewall
          - local_ca
          - nginx
          - ssh_hardening
          - tls
          - users

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Install Ansible and Molecule
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.21.5 molecule==26.10.0 'molecule-plugins[podman]'

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml -p ./collections

      - name: Run Molecule tests
        working-directory: roles/${{ matrix.role }}
        run: molecule test
